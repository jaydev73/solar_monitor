<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Solar Monitor animated energy flow banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="1" stop-color="#12315c"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb020" stop-opacity=".55"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5f8fd6" stroke-opacity=".10"/></pattern>
  </defs>
  <style>
    text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
    .t{font-size:54px;font-weight:700;fill:#fff}
    .s{font-size:20px;fill:#9fb3d1}
    .l{font-size:14px;fill:#8fa3c4;text-anchor:middle}
    .rail{fill:none;stroke:#5f7090;stroke-opacity:.25;stroke-width:6;stroke-linecap:round}
    .f{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:.1 14;animation:d 1s linear infinite}
    .f2{animation-duration:1.3s}.f3{animation-duration:1.1s}.f4{animation-duration:1.6s}
    @keyframes d{to{stroke-dashoffset:-14.1}}
    .ray{transform-origin:100px 190px;animation:spin 18s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:p 2.4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.45}50%{opacity:1}}
    .b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}
    .sine{fill:none;stroke:#c4a1ff;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:46 10;animation:sd 1.4s linear infinite}
    @keyframes sd{to{stroke-dashoffset:-56}}
    .box{fill:#111a2b;stroke-width:3}
  </style>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="100" cy="190" r="90" fill="url(#glow)" class="pulse"/>

  <text class="t" x="600" y="86" text-anchor="middle">Solar Monitor</text>
  <text class="s" x="600" y="122" text-anchor="middle">Live energy-flow dashboard · EPever MPPT · JBD BMS · 12 V load control</text>

  <!-- rails + flows -->
  <g>
    <path class="rail" d="M195 235H345"/><path class="rail" d="M455 235H610"/><path class="rail" d="M715 235H865"/><path class="rail" d="M975 235H1075"/>
    <path class="f"  d="M195 235H345" stroke="#ffb020"/>
    <path class="f f2" d="M455 235H610" stroke="#3ddc97"/>
    <path class="f f3" d="M715 235H865" stroke="#7aa2ff"/>
    <path class="f f4" d="M975 235H1075" stroke="#c4a1ff"/>
  </g>

  <!-- sun + panels -->
  <g class="ray" stroke="#ffb020" stroke-width="3" stroke-linecap="round">
    <path d="M100 160v-9M100 220v9M70 190h-9M130 190h9M79 169l-6-6M121 211l6 6M121 169l6-6M79 211l-6 6" transform="translate(0 0)"/>
  </g>
  <circle cx="100" cy="190" r="13" fill="#ffb020"/>
  <g transform="translate(118 218) skewX(-14)" fill="#16315c" stroke="#5f8fd6" stroke-width="1.2">
    <rect width="20" height="14"/><rect x="22" width="20" height="14"/><rect x="44" width="20" height="14"/>
    <rect y="16" width="20" height="14"/><rect x="22" y="16" width="20" height="14"/><rect x="44" y="16" width="20" height="14"/>
  </g>

  <!-- MPPT -->
  <rect class="box" x="345" y="200" width="110" height="70" rx="12" stroke="#3ddc97"/>
  <rect x="358" y="211" width="84" height="22" rx="5" fill="#050c18"/>
  <text x="400" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#3ddc97" style="font-family:'Segoe UI',Arial,sans-serif">MPPT</text>
  <g fill="#ffb020"><rect x="370" y="245" width="14" height="12" rx="2"/><rect x="393" y="245" width="14" height="12" rx="2"/><rect x="416" y="245" width="14" height="12" rx="2"/></g>

  <!-- Battery -->
  <rect class="box" x="610" y="206" width="105" height="58" rx="9" stroke="#38bdf8"/>
  <rect x="715" y="224" width="8" height="22" rx="2" fill="#38bdf8"/>
  <g fill="#3ddc97"><rect class="pulse" x="622" y="218" width="16" height="34" rx="3"/><rect class="pulse b2" x="643" y="218" width="16" height="34" rx="3"/><rect class="pulse b3" x="664" y="218" width="16" height="34" rx="3"/><rect class="pulse b4" x="685" y="218" width="16" height="34" rx="3"/></g>

  <!-- Inverter -->
  <rect class="box" x="865" y="200" width="110" height="70" rx="12" stroke="#7aa2ff"/>
  <path class="sine" d="M878 235q8 -16 16 0t16 0t16 0t16 0t16 0t16 0"/>
  <text x="920" y="260" text-anchor="middle" font-size="12" fill="#9fb3d1" style="font-family:'Segoe UI',Arial,sans-serif">12 V → AC</text>

  <!-- Home / loads -->
  <path d="M1080 248L1120 210L1160 248V272H1080Z" fill="#111a2b" stroke="#c4a1ff" stroke-width="3" stroke-linejoin="round"/>
  <rect x="1110" y="250" width="20" height="22" rx="2" fill="#c4a1ff" class="pulse"/>

  <text class="l" x="130" y="304">Solar panels</text>
  <text class="l" x="400" y="304">EPever MPPT</text>
  <text class="l" x="662" y="304">LiFePO₄ bank</text>
  <text class="l" x="920" y="304">Inverter</text>
  <text class="l" x="1120" y="304">AC loads</text>
</svg>
